services:
  postgres:
    ports: ["${DEV_BIND_ADDRESS:-127.0.0.1}:5432:5432"]
  redis:
    ports: ["${DEV_BIND_ADDRESS:-127.0.0.1}:6379:6379"]
  migrate:
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8080
      USER_APP_URL: http://localhost:5173
      SUPPORT_EMAIL: support@linlinqi.local
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
  api:
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8080
      USER_APP_URL: http://localhost:5173
      OAUTH_PROVIDERS_JSON: "${OAUTH_PROVIDERS_JSON:-{}}"
      SUPPORT_EMAIL: support@linlinqi.local
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080/media
      MEDIA_STORAGE_MAX_BYTES: "10737418240"
      MEDIA_MIN_FREE_BYTES: "1073741824"
      BOOTSTRAP_ADMIN: "true"
      SEED_DATA: "true"
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-LinLinQi@2026}
  worker:
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8080
      USER_APP_URL: http://localhost:5173
      OAUTH_PROVIDERS_JSON: "${OAUTH_PROVIDERS_JSON:-{}}"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080/media
      MEDIA_STORAGE_MAX_BYTES: "10737418240"
      MEDIA_MIN_FREE_BYTES: "1073741824"
  user:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
  admin:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8080/admin/v1
