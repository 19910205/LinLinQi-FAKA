worker_processes auto;
pid /Users/dahai/.linlinqi/run/nginx.pid;
error_log /Users/dahai/.linlinqi/logs/nginx-error.log warn;

events {
  worker_connections 2048;
}

http {
  include /usr/local/etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /Users/dahai/.linlinqi/logs/nginx-access.log;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_body_temp_path /Users/dahai/.linlinqi/run/nginx/client;
  proxy_temp_path /Users/dahai/.linlinqi/run/nginx/proxy;
  fastcgi_temp_path /Users/dahai/.linlinqi/run/nginx/fastcgi;
  uwsgi_temp_path /Users/dahai/.linlinqi/run/nginx/uwsgi;
  scgi_temp_path /Users/dahai/.linlinqi/run/nginx/scgi;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $sent_http_content_type $cache_control {
    default "public, max-age=604800, immutable";
    "text/html" "no-cache";
  }

  server {
    listen 127.0.0.1:8081;
    server_name 127.0.0.1 localhost;
    root /Users/dahai/Documents/faka/user/dist;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: http://127.0.0.1:8081; connect-src 'self' http://127.0.0.1:8080 https:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The API validates the content-addressed path and file type. Nginx never
    # receives direct filesystem access to staging, quarantine, or sync spool.
    location ^~ /media/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Content-Security-Policy;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      access_log off;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 127.0.0.1:8082;
    server_name 127.0.0.1 localhost;
    root /Users/dahai/Documents/faka/admin/dist;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: http://127.0.0.1:8081; connect-src 'self' http://127.0.0.1:8080 https:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /media/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Content-Security-Policy;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      access_log off;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
