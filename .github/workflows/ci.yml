name: LinLinQi CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linlinqi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: linlinqi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: linlinqi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linlinqi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CGO_ENABLED: "0"
      APP_ENV: test
      DATABASE_URL: postgres://postgres:linlinqi-ci-password@127.0.0.1:5432/linlinqi_test?sslmode=disable
      LINLINQI_TEST_DATABASE_URL: postgres://postgres:linlinqi-ci-password@127.0.0.1:5432/linlinqi_test?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
      BOOTSTRAP_ADMIN: "false"
      SEED_DATA: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: api/go.sum
      - run: go run ./cmd/linlinqi migrate
        working-directory: api
      - run: go run ./cmd/linlinqi migrate
        working-directory: api
      - run: go test ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
        working-directory: api
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/linlinqi
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm install --global npm@12.0.2
      - run: node ../scripts/verify-toolchain.mjs
        working-directory: ${{ matrix.app }}
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.app }}
      - run: npx prettier --check src
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated smoke-test environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-0123456789abcdef0123456789|' \
            -e 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-redis-0123456789abcdef0123456789|' \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-user-jwt-0123456789abcdef0123456789|' \
            -e 's|^ADMIN_JWT_SECRET=.*|ADMIN_JWT_SECRET=ci-admin-jwt-0123456789abcdef01234567|' \
            -e 's|^DATA_ENCRYPTION_KEY=.*|DATA_ENCRYPTION_KEY=ci-data-key-0123456789abcdef0123456789|' \
            -e 's|^OPENAPI_KEY=.*|OPENAPI_KEY=linlinqi_ci_0123456789abcdef|' \
            -e 's|^OPENAPI_SECRET=.*|OPENAPI_SECRET=ci-openapi-0123456789abcdef0123456789|' \
            -e 's|^METRICS_TOKEN=.*|METRICS_TOKEN=ci-metrics-0123456789abcdef0123456789|' \
            -e 's|^APP_URL=.*|APP_URL=https://api.ci.linlinqi.example.com|' \
            -e 's|^USER_APP_URL=.*|USER_APP_URL=https://store.ci.linlinqi.example.com|' \
            -e 's|^SUPPORT_EMAIL=.*|SUPPORT_EMAIL=support@ci.linlinqi.example.com|' \
            -e 's|^CORS_ORIGINS=.*|CORS_ORIGINS=https://store.ci.linlinqi.example.com,https://admin.ci.linlinqi.example.com|' \
            -e 's|^PUBLIC_USER_API_URL=.*|PUBLIC_USER_API_URL=https://api.ci.linlinqi.example.com/api/v1|' \
            -e 's|^PUBLIC_ADMIN_API_URL=.*|PUBLIC_ADMIN_API_URL=https://api.ci.linlinqi.example.com/admin/v1|' \
            -e 's|^MEDIA_PUBLIC_BASE_URL=.*|MEDIA_PUBLIC_BASE_URL=https://api.ci.linlinqi.example.com/media|' \
            -e 's|^MEDIA_STORAGE_MAX_BYTES=.*|MEDIA_STORAGE_MAX_BYTES=10737418240|' \
            -e 's|^MEDIA_MIN_FREE_BYTES=.*|MEDIA_MIN_FREE_BYTES=1073741824|' \
            -e "s|^LINLINQI_IMAGE_TAG=.*|LINLINQI_IMAGE_TAG=ci-${GITHUB_SHA}|" \
            .env
          chmod 600 .env
      - name: Validate Compose model
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: Build and start production topology
        run: docker compose --env-file .env -f docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Verify public health endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/live
          curl --fail --silent --show-error http://127.0.0.1:8080/ready
          curl --fail --silent --show-error http://127.0.0.1:5173/healthz
          curl --fail --silent --show-error http://127.0.0.1:5174/healthz
          docker compose --env-file .env -f docker-compose.yml exec -T api \
            /bin/sh -ceu 'test -w /var/lib/linlinqi/storage/media/staging'
          docker compose --env-file .env -f docker-compose.yml exec -T worker \
            /bin/sh -ceu 'test -w /var/lib/linlinqi/storage/media/staging'
      - name: Exercise verified backup and destructive restore
        run: |
          backup_dir="$RUNNER_TEMP/linlinqi-backups"
          bash scripts/backup-postgres.sh "$backup_dir"
          backup_file="$(find "$backup_dir" -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$backup_file"
          LINLINQI_RESTORE_CONFIRM="restore:$(basename "$backup_file")" \
            LINLINQI_SKIP_SAFETY_BACKUP=true \
            bash scripts/restore-postgres.sh "$backup_file"
      - name: Show service diagnostics
        if: failure()
        run: |
          if test -f .env; then
            docker compose --env-file .env -f docker-compose.yml ps --all || true
            docker compose --env-file .env -f docker-compose.yml logs --no-color --tail=300 || true
          fi
      - name: Remove smoke-test resources
        if: always()
        run: |
          if test -f .env; then
            docker compose --env-file .env -f docker-compose.yml down --volumes --remove-orphans || true
          fi
